# Postgres 18 with pgvector + pg_textsearch — one stack per environment.
#
# The environment is a single variable, `CBAC_ENV`. It names the compose project,
# so the container, the network and the data volume are all namespaced by it: two
# environments on the same host never touch each other's data. The image is the
# same for every environment — nothing environment-specific is baked into
# `Dockerfile.postgres` — so the second stack is a cache hit, not a second build.
#
# Usage:
#   cd cbac_service
#   docker compose --env-file .env.dev       up -d
#   docker compose --env-file .env.test-prod up -d
#
# The same env file configures alembic and the service itself:
#   uv run --env-file .env.dev alembic upgrade head
#
# Connect manually (dev defaults):
#   psql postgresql://cbac_user:cbac_pass@localhost:5432/cbac

name: cbac-${CBAC_ENV:-dev}

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    # Fixed tag, deliberately not per-environment: every stack runs the identical
    # image, built once.
    image: cbac-postgres:pg18
    # Spelled out rather than left to compose's `<project>-postgres-1`, so
    # `docker exec`/`docker logs` take a predictable name.
    container_name: cbac-${CBAC_ENV:-dev}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbac_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbac_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cbac}
    ports:
      # The host port differs per environment; inside the container it is always 5432.
      - "${PG_PORT:-5432}:5432"
    volumes:
      # Named volume, namespaced by the project name above. Set PG_DATA_PATH to
      # bind-mount a host directory instead.
      - ${PG_DATA_PATH:-pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbac_user} -d ${POSTGRES_DB:-cbac}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
