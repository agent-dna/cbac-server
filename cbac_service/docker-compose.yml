# Docker Compose for local development — Postgres 18 with pgvector + pg_textsearch.
#
# Usage:
#   cd cbac_service
#   docker compose up -d
#   alembic upgrade head
#   uvicorn cbac_service.main:app
#
# First run builds the custom Postgres image (~2-3 min). Subsequent runs are instant.
#
# Connect manually:
#   psql postgresql://cbac_user:cbac_pass@localhost:5432/cbac

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: cbac-postgres
    environment:
      POSTGRES_USER: cbac_user
      POSTGRES_PASSWORD: cbac_pass
      POSTGRES_DB: cbac
    ports:
      - "5432:5432"
    volumes:
      - ${PG_DATA_PATH:-cbac_pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbac_user -d cbac"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cbac_pgdata:
