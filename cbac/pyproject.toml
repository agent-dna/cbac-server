[project]
name = "cbac"
version = "0.1.0"
description = "Framework-agnostic guard for CBAC: authorize an agent's action against its policy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent", "authorization", "policy", "mcp", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

# The guard makes one HTTP call and does nothing else; the decision service
# owns every ML dependency. Keep this list at one entry.
dependencies = ["requests>=2.32.0"]

[project.urls]
Homepage = "https://github.com/agent-dna/cbac-server"
Repository = "https://github.com/agent-dna/cbac-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbac"]
