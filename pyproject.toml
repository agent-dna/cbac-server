[project]
name = "cbac-service"
version = "0.1.0"
description = "Reference CBAC decision service for agent-dna"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"

dependencies = [
  # The library, from agentdna/ in this checkout — see [tool.uv.sources] below.
  "agent-dna>=0.6.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "structlog>=24.1.0",
  "sentence-transformers>=3.0.0",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  # HHEM-2.1's remote code (hallucination_score) is incompatible with transformers 5.x
  "transformers>=4.40.0,<5",
  # ORM + Vector DB
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pgvector>=0.3.6",
  "greenlet>=3.0.0",
  # v2 gate: allow/deny tuples live in OpenFGA; the policy and query parsers
  # call Ollama (stdlib HTTP, no SDK) or the Claude API.
  "openfga-sdk>=0.10.5",
  "anthropic>=2.3.0",
  # The guard, from cbac/ in this checkout — see [tool.uv.sources] below.
  "cbac",
]

# Deployed from a checkout (uvicorn cbac_service.cbac:app).
[tool.uv]
package = false
# agent-dna's editable install as a plain path entry (setuptools "compat" mode)
# rather than an import hook. The repo root is on sys.path for pytest and the
# example runners, and its `agentdna/` directory would otherwise be imported as
# an empty namespace package; a path entry to the real package wins over it.
config-settings-package = { agent-dna = { editable_mode = "compat" } }

# The guard is its own distribution (published to PyPI as `cbac`); the service
# depends on it from this checkout rather than from the index.
[tool.uv.workspace]
members = ["cbac"]

# agent-dna is vendored under agentdna/ and installed editable from there, so
# library edits are live. It is a path source, not a workspace member: it keeps
# its own pyproject (dev group, ruff and pyright config) and its own tests.
[tool.uv.sources]
cbac = { workspace = true }
agent-dna = { path = "agentdna", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mcp>=2.0.0",
    "ruff==0.16.3",
    "pyright==1.1.411",
    # The eval suite's policy corpus is YAML (cbac_service/tests/eval/corpus/).
    "pyyaml>=6.0",
]

[tool.ruff]
# The guard is first-party even though it lives in its own project directory:
# without this, isort files `cbac` and `cbac.mcp` into different groups.
src = [".", "cbac/src"]

[tool.ruff.lint]
# The decision pipeline is fail-closed by design: any error becomes a `deny`, and
# a failed trust update is logged rather than raised. Every `except Exception`
# here is that contract, not an oversight.
ignore = ["BLE001"]

[tool.pyright]
# Without these, a bare `pyright <file>` (what the PostToolUse hook runs) falls back
# to system Python and reports every third-party import as unresolved, while
# `uv run pyright` succeeds. Pinning the venv makes the hook and CI agree.
venvPath = "."
venv = ".venv"

# examples/ installs its own venv from its own requirements.txt (langgraph,
# fastmcp, the LLM providers) — none of which belong in this repo's lock file.
# Checking it against the root venv would report every one as unresolved.
# agentdna/ is the vendored library: it carries its own pyright config and its
# own dev dependencies (fastmcp), so it is checked from there, not from here.
# Defaults are replaced, not merged, so the usual ignores are repeated here.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "examples", "agentdna"]

# Test doubles — SimpleNamespace fakes, None sessions, monkeypatched repositories —
# deliberately don't satisfy production signatures; that is what makes them usable
# as doubles. Everything else still type-checks here.
[[tool.pyright.executionEnvironments]]
root = "cbac_service/tests"
# `root` also re-roots import resolution, so `from cbac_service.cbac import ...`
# stops resolving without the repo root added back (mirrors pytest's pythonpath).
extraPaths = ["."]
reportArgumentType = "none"
reportAttributeAccessIssue = "none"

[tool.pytest.ini_options]
# `from cbac_service.cbac import ...` resolves against the repo root.
pythonpath = ["."]
# examples/agentdna_local needs nothing beyond this venv (agent-dna, cbac,
# cryptography), so its tests run here; the examples' own tests do not.
testpaths = ["cbac_service/tests", "examples/agentdna_local/tests"]
