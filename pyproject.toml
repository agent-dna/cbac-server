[project]
name = "cbac-service"
version = "0.1.0"
description = "Reference CBAC decision service for agent-dna"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"

dependencies = [
  "agent-dna>=0.4.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "structlog>=24.1.0",
  "sentence-transformers>=3.0.0",
  "scipy>=1.10.0",
  "numpy>=1.24.0",
  # HHEM-2.1's remote code (hallucination_score) is incompatible with transformers 5.x
  "transformers>=4.40.0,<5",
  # ORM + Vector DB
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pgvector>=0.3.6",
  "greenlet>=3.0.0",
]

# Deployed from a checkout (uvicorn cbac_service.cbac:app); not published as a wheel.
[tool.uv]
package = false

[dependency-groups]
# cbac/mcp.py imports mcp.types. Declared directly rather than via an
# agent-dna extra, which the published wheel doesn't ship.
dev = [
    "pytest>=8.0.0",
    "mcp>=1.2.0",
    # Pinned exactly, not floored: CI must resolve these to the same versions the
    # local PostToolUse hook runs. Bump both here.
    "ruff==0.16.3",
    "pyright==1.1.411",
]

[tool.ruff.lint]
# The decision pipeline is fail-closed by design: any error becomes a `deny`, and
# a failed trust update is logged rather than raised. Every `except Exception`
# here is that contract, not an oversight.
ignore = ["BLE001"]

[tool.pytest.ini_options]
# `from cbac_service.cbac import ...` resolves against the repo root.
pythonpath = ["."]
testpaths = ["cbac_service/tests"]
